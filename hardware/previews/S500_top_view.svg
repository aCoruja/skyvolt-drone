<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" width="640" height="600" font-family="Helvetica, Arial, sans-serif">
  <!-- Vista superior do frame S500 em Quad X, em escala (0,8 px = 1 mm).
       Distância diagonal entre motores 480 mm -> motor a ±169,7 mm em x/y = ±135,8 px. -->
  <rect x="0" y="0" width="640" height="600" rx="16" fill="#ffffff"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">Frame S500 — Quad X (vista superior, em escala)</text>

  <g transform="translate(300,310)">
    <!-- discos das hélices 10" (254 mm -> r = 101,6 px) -->
    <g fill="#dbeafe" fill-opacity="0.55" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6 4">
      <circle cx="-135.8" cy="-135.8" r="101.6"/>
      <circle cx="135.8" cy="-135.8" r="101.6"/>
      <circle cx="135.8" cy="135.8" r="101.6"/>
      <circle cx="-135.8" cy="135.8" r="101.6"/>
    </g>

    <!-- braços -->
    <g stroke="#111827" stroke-width="14" stroke-linecap="round">
      <line x1="-30" y1="-30" x2="-135.8" y2="-135.8"/>
      <line x1="30" y1="-30" x2="135.8" y2="-135.8"/>
      <line x1="30" y1="30" x2="135.8" y2="135.8"/>
      <line x1="-30" y1="30" x2="-135.8" y2="135.8"/>
    </g>

    <!-- placa central (PCB de distribuição de energia) -->
    <rect x="-56" y="-56" width="112" height="112" rx="14" fill="#16a34a" stroke="#14532d" stroke-width="2"/>
    <text x="0" y="-6" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">placa central</text>
    <text x="0" y="10" text-anchor="middle" font-size="11" fill="#ffffff">PCB + distribuição</text>
    <text x="0" y="25" text-anchor="middle" font-size="11" fill="#ffffff">de energia</text>

    <!-- seta da frente -->
    <path d="M0,-78 l-10,14 h20 z" fill="#dc2626"/>
    <text x="0" y="-84" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">FRENTE</text>

    <!-- motores A2212 (can 27,5 mm -> r ≈ 11 px) com sentido de giro (Quad X ArduCopter) -->
    <g stroke="#111827" stroke-width="2">
      <circle cx="135.8" cy="-135.8" r="12" fill="#f59e0b"/>
      <circle cx="-135.8" cy="135.8" r="12" fill="#f59e0b"/>
      <circle cx="-135.8" cy="-135.8" r="12" fill="#a78bfa"/>
      <circle cx="135.8" cy="135.8" r="12" fill="#a78bfa"/>
    </g>
    <g font-size="12" font-weight="bold" fill="#111827" text-anchor="middle">
      <text x="135.8" y="-131.5">1</text>
      <text x="-135.8" y="140">2</text>
      <text x="-135.8" y="-131.5">3</text>
      <text x="135.8" y="140">4</text>
    </g>
    <g font-size="11" fill="#374151" text-anchor="middle">
      <text x="135.8" y="-158">CCW</text>
      <text x="-135.8" y="168">CCW</text>
      <text x="-135.8" y="-158">CW</text>
      <text x="135.8" y="168">CW</text>
    </g>

    <!-- cota diagonal 480 mm -->
    <line x1="-135.8" y1="135.8" x2="135.8" y2="-135.8" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="70" y="-46" font-size="13" font-weight="bold" fill="#374151" transform="rotate(-45 70 -46)">480 mm (motor a motor)</text>

    <!-- cota de folga entre hélices vizinhas (frente) -->
    <line x1="-34.2" y1="-135.8" x2="34.2" y2="-135.8" stroke="#dc2626" stroke-width="1.5"/>
    <line x1="-34.2" y1="-141.8" x2="-34.2" y2="-129.8" stroke="#dc2626" stroke-width="1.5"/>
    <line x1="34.2" y1="-141.8" x2="34.2" y2="-129.8" stroke="#dc2626" stroke-width="1.5"/>
    <text x="0" y="-146" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">~85 mm de folga</text>
  </g>

  <!-- legenda -->
  <g font-size="12" fill="#374151">
    <circle cx="40" cy="556" r="8" fill="#dbeafe" stroke="#3b82f6" stroke-dasharray="4 3"/>
    <text x="54" y="560">hélice 10" (1045)</text>
    <circle cx="190" cy="556" r="7" fill="#a78bfa" stroke="#111827"/>
    <text x="203" y="560">CW</text>
    <circle cx="250" cy="556" r="7" fill="#f59e0b" stroke="#111827"/>
    <text x="263" y="560">CCW</text>
    <text x="320" y="560">motor A2212 1000kV · furação 16×19 mm</text>
    <text x="40" y="582" fill="#6b7280">Numeração e sentido de giro da Quad X do ArduCopter. Esquema próprio do projeto, não é foto do produto.</text>
  </g>
</svg>
