<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Helvetica, Arial, sans-serif">
  <!-- Vista lateral esquemática (fora de escala): hexa impresso com motores alternados x S500 com todos os motores para cima. -->
  <rect x="0" y="0" width="900" height="400" rx="16" fill="#ffffff"/>
  <defs>
    <marker id="seta" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/>
    </marker>
    <marker id="setaR" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- ================= ANTES: hexa impresso ================= -->
  <text x="225" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">Antes — hexa impresso (Rev. 1.3)</text>
  <line x1="30" y1="300" x2="420" y2="300" stroke="#6b7280" stroke-width="3"/>
  <!-- corpo e braços -->
  <rect x="190" y="230" width="70" height="22" rx="4" fill="#9ca3af" stroke="#374151"/>
  <line x1="70" y1="241" x2="380" y2="241" stroke="#374151" stroke-width="8" stroke-linecap="round"/>
  <!-- motor de cima (riser 40 mm) à esquerda -->
  <rect x="94" y="197" width="8" height="40" fill="#6b7280"/>
  <rect x="86" y="185" width="24" height="14" rx="3" fill="#a78bfa" stroke="#111827"/>
  <line x1="48" y1="182" x2="148" y2="182" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
  <!-- motor invertido embaixo à direita -->
  <rect x="338" y="245" width="24" height="14" rx="3" fill="#f59e0b" stroke="#111827"/>
  <line x1="300" y1="263" x2="400" y2="263" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
  <!-- pés curtos -->
  <line x1="200" y1="252" x2="196" y2="300" stroke="#374151" stroke-width="4"/>
  <line x1="250" y1="252" x2="254" y2="300" stroke="#374151" stroke-width="4"/>
  <!-- ar batendo no chão e voltando -->
  <path d="M330,270 v22" stroke="#dc2626" stroke-width="2" marker-end="url(#setaR)"/>
  <path d="M370,270 v22" stroke="#dc2626" stroke-width="2" marker-end="url(#setaR)"/>
  <path d="M395,294 q22,-8 14,-34" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#setaR)"/>
  <path d="M305,294 q-22,-8 -14,-34" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#setaR)"/>
  <text x="350" y="318" text-anchor="middle" font-size="12" fill="#dc2626">hélice de baixo a poucos cm do chão</text>
  <g font-size="13" fill="#374151">
    <text x="30" y="346">• 3 motores em cima + 3 invertidos embaixo</text>
    <text x="30" y="366">• fácil montar hélice invertida ao contrário</text>
    <text x="30" y="386">• ar rebatido no chão: turbulência ao decolar</text>
  </g>

  <line x1="450" y1="60" x2="450" y2="380" stroke="#e5e7eb" stroke-width="2"/>

  <!-- ================= DEPOIS: S500 ================= -->
  <text x="675" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">Depois — S500 (Quad X)</text>
  <line x1="480" y1="300" x2="870" y2="300" stroke="#6b7280" stroke-width="3"/>
  <!-- placas centrais -->
  <rect x="635" y="150" width="80" height="8" rx="2" fill="#16a34a" stroke="#14532d"/>
  <rect x="635" y="172" width="80" height="8" rx="2" fill="#16a34a" stroke="#14532d"/>
  <!-- braços -->
  <line x1="520" y1="160" x2="830" y2="160" stroke="#111827" stroke-width="8" stroke-linecap="round"/>
  <!-- motores para cima -->
  <rect x="532" y="140" width="24" height="16" rx="3" fill="#a78bfa" stroke="#111827"/>
  <rect x="794" y="140" width="24" height="16" rx="3" fill="#f59e0b" stroke="#111827"/>
  <line x1="494" y1="136" x2="594" y2="136" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
  <line x1="756" y1="136" x2="856" y2="136" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
  <!-- fluxo para baixo, livre -->
  <path d="M520,146 v40" stroke="#2563eb" stroke-width="2" marker-end="url(#seta)"/>
  <path d="M568,146 v40" stroke="#2563eb" stroke-width="2" marker-end="url(#seta)"/>
  <path d="M782,146 v40" stroke="#2563eb" stroke-width="2" marker-end="url(#seta)"/>
  <path d="M830,146 v40" stroke="#2563eb" stroke-width="2" marker-end="url(#seta)"/>
  <!-- trem de pouso alto -->
  <line x1="650" y1="180" x2="610" y2="296" stroke="#374151" stroke-width="5"/>
  <line x1="700" y1="180" x2="740" y2="296" stroke="#374151" stroke-width="5"/>
  <line x1="590" y1="298" x2="630" y2="298" stroke="#374151" stroke-width="6" stroke-linecap="round"/>
  <line x1="720" y1="298" x2="760" y2="298" stroke="#374151" stroke-width="6" stroke-linecap="round"/>
  <!-- bateria embaixo -->
  <rect x="645" y="190" width="60" height="22" rx="3" fill="#fde68a" stroke="#92400e"/>
  <text x="675" y="205" text-anchor="middle" font-size="11" fill="#92400e">bateria</text>
  <!-- Pixhawk reta em cima -->
  <rect x="650" y="132" width="50" height="16" rx="3" fill="#1f2937"/>
  <text x="675" y="144" text-anchor="middle" font-size="10" fill="#ffffff">Pixhawk</text>
  <!-- cota altura -->
  <line x1="855" y1="160" x2="855" y2="298" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="862" y="235" font-size="12" fill="#16a34a" transform="rotate(90 862 235)" text-anchor="middle">hélice bem acima do chão</text>
  <g font-size="13" fill="#374151">
    <text x="480" y="346">• 4 motores, todos para cima (padrão)</text>
    <text x="480" y="366">• trem de pouso alto + PCB de energia embutida</text>
    <text x="480" y="386">• 2 motores/ESCs A2212 sobram como reserva</text>
  </g>
</svg>
